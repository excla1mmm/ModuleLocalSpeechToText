<svg xmlns="http://www.w3.org/2000/svg" width="300" height="310" viewBox="0 0 300 310" role="img" aria-labelledby="title desc">
  <title id="title">Local Speech to Text for MikoPBX</title>
  <desc id="desc">A MikoPBX monitor showing local call transcription, with a microphone badge.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="23" y="72" width="215" height="160" rx="8"/>
    </clipPath>
  </defs>

  <!-- Monitor -->
  <path d="M27 38h201c15 0 27 12 27 27v160c0 16-13 29-29 29H29C13 254 0 241 0 225V65c0-15 12-27 27-27Z" fill="#a8d5e3"/>
  <rect x="10" y="47" width="235" height="196" rx="20" fill="#f8fafc"/>
  <rect x="23" y="72" width="215" height="160" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g clip-path="url(#screenClip)">
    <!-- Browser chrome -->
    <rect x="23" y="72" width="215" height="19" fill="#f8fafc"/>
    <circle cx="33" cy="81" r="4" fill="#fb7185"/>
    <circle cx="46" cy="81" r="4" fill="#facc15"/>
    <circle cx="59" cy="81" r="4" fill="#86cf73"/>
    <rect x="85" y="75" width="87" height="13" rx="7" fill="#606060"/>
    <text x="128.5" y="84.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">mikopbx</text>
    <circle cx="214" cy="81" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <path d="M214 79v4m-2-2h4" stroke="#94a3b8" stroke-width=".8"/>

    <!-- Sidebar -->
    <rect x="23" y="91" width="64" height="141" fill="#475569"/>
    <rect x="23" y="91" width="64" height="20" fill="#334155"/>
    <image x="27" y="96" width="56" height="9.6" preserveAspectRatio="xMidYMid meet"
      href="data:image/svg+xml;base64,"/>
    <g font-family="Arial, sans-serif" font-size="5.15" fill="#e2e8f0">
      <text x="28" y="122">Телефония</text>
      <text x="28" y="132">Сотрудники</text>
      <text x="28" y="142">Очереди вызовов</text>
      <text x="28" y="152">IVR меню</text>
      <text x="28" y="162">Конференции</text>
      <text x="28" y="172">Звуковые файлы</text>
      <text x="28" y="182">История вызовов</text>
      <text x="28" y="192" font-weight="700" fill="#fff">Модули</text>
      <text x="28" y="205">Интеграция с 1С</text>
      <text x="28" y="216">Интеграция с Bitrix24</text>
      <text x="28" y="227">•••</text>
    </g>

    <!-- Module header -->
    <rect x="87" y="91" width="151" height="31" fill="#fff"/>
    <g transform="translate(96 96)">
      <rect width="18" height="18" rx="4" fill="#1f2937"/>
      <path d="M9 3.2a3 3 0 0 0-3 3v3.3a3 3 0 0 0 6 0V6.2a3 3 0 0 0-3-3Z" fill="#e5e7eb"/>
      <path d="M4 9a5 5 0 0 0 10 0M9 14v2.2M6.8 16.2h4.4" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="119" y="104" font-family="Arial, sans-serif" font-weight="700" font-size="7.6" fill="#475569">Локальное</text>
    <text x="119" y="114" font-family="Arial, sans-serif" font-size="7.6" fill="#475569">распознавание</text>

    <!-- Tabs -->
    <rect x="87" y="122" width="151" height="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-family="Arial, sans-serif" font-size="5.8" fill="#64748b">
      <text x="94" y="136">Настройки</text>
      <text x="130" y="136">Очередь</text>
      <text x="158" y="136">Воркеры</text>
      <text x="191" y="136" font-weight="700" fill="#0284c7">Транскрипты</text>
    </g>
    <rect x="187" y="141" width="46" height="2" rx="1" fill="#38bdf8"/>

    <!-- Transcript rows -->
    <rect x="87" y="144" width="151" height="18" fill="#e0f2fe"/>
    <text x="94" y="156" font-family="Arial, sans-serif" font-size="6.2" fill="#334155">Последние расшифровки</text>
    <text x="229" y="156" text-anchor="end" font-family="Arial, sans-serif" font-size="5.5" fill="#64748b">Сегодня</text>

    <g font-family="Arial, sans-serif">
      <rect x="87" y="162" width="151" height="23" fill="#fff"/>
      <circle cx="98" cy="173.5" r="5" fill="#dcfce7"/>
      <path d="M96 174l1.5 1.5 3-3.5" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="107" y="171" font-size="6.2" fill="#334155">201 → 205</text>
      <text x="107" y="179" font-size="5.3" fill="#64748b">Обсуждение заказа…</text>
      <text x="230" y="175" text-anchor="end" font-size="5.6" fill="#64748b">10:42</text>

      <rect x="87" y="185" width="151" height="23" fill="#f8fafc"/>
      <circle cx="98" cy="196.5" r="5" fill="#dcfce7"/>
      <path d="M96 197l1.5 1.5 3-3.5" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="107" y="194" font-size="6.2" fill="#334155">301 → 203</text>
      <text x="107" y="202" font-size="5.3" fill="#64748b">Запись распознана</text>
      <text x="230" y="198" text-anchor="end" font-size="5.6" fill="#64748b">09:18</text>

      <rect x="87" y="208" width="151" height="24" fill="#fff"/>
      <circle cx="98" cy="219.5" r="5" fill="#fef3c7"/>
      <path d="M98 216.5v3.5m0 2v.2" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
      <text x="107" y="217" font-size="6.2" fill="#334155">Внешний звонок</text>
      <text x="107" y="225" font-size="5.3" fill="#64748b">Обработка аудио…</text>
      <text x="230" y="221" text-anchor="end" font-size="5.6" fill="#64748b">08:51</text>
    </g>
    <path d="M87 162h151M87 185h151M87 208h151" stroke="#cbd5e1" stroke-width=".7"/>
  </g>

  <!-- Monitor stand -->
  <rect x="110" y="239" width="74" height="23" rx="12" fill="#a8d5e3"/>
  <rect x="115" y="242" width="64" height="16" rx="8" fill="#f8fafc"/>

  <!-- Keyboard -->
  <g filter="url(#shadow)">
    <path d="M38 278h180l5 28H34Z" fill="#b6dce8"/>
    <path d="M41 279h174l3 20H38Z" fill="#fff" stroke="#94a3b8" stroke-width=".8"/>
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width=".45">
      <rect x="43" y="280" width="11" height="7" rx="1"/><rect x="56" y="280" width="11" height="7" rx="1"/><rect x="69" y="280" width="11" height="7" rx="1"/><rect x="82" y="280" width="11" height="7" rx="1"/><rect x="95" y="280" width="11" height="7" rx="1"/><rect x="108" y="280" width="11" height="7" rx="1"/><rect x="121" y="280" width="11" height="7" rx="1"/><rect x="134" y="280" width="11" height="7" rx="1"/><rect x="147" y="280" width="11" height="7" rx="1"/><rect x="160" y="280" width="11" height="7" rx="1"/><rect x="173" y="280" width="11" height="7" rx="1"/><rect x="186" y="280" width="11" height="7" rx="1"/><rect x="199" y="280" width="13" height="7" rx="1"/>
      <rect x="45" y="289" width="13" height="7" rx="1"/><rect x="60" y="289" width="13" height="7" rx="1"/><rect x="75" y="289" width="13" height="7" rx="1"/><rect x="90" y="289" width="13" height="7" rx="1"/><rect x="105" y="289" width="13" height="7" rx="1"/><rect x="120" y="289" width="13" height="7" rx="1"/><rect x="135" y="289" width="13" height="7" rx="1"/><rect x="150" y="289" width="13" height="7" rx="1"/><rect x="165" y="289" width="13" height="7" rx="1"/><rect x="180" y="289" width="13" height="7" rx="1"/><rect x="195" y="289" width="17" height="7" rx="1"/>
      <rect x="48" y="298" width="19" height="6" rx="1"/><rect x="69" y="298" width="18" height="6" rx="1"/><rect x="89" y="298" width="66" height="6" rx="1"/><rect x="157" y="298" width="18" height="6" rx="1"/><rect x="177" y="298" width="18" height="6" rx="1"/><rect x="197" y="298" width="18" height="6" rx="1"/>
    </g>
  </g>

  <!-- Corner badge -->
  <g filter="url(#shadow)">
    <path d="M249 1 299 52l-9 31-31 9c-27 0-49-21-49-47 0-24 17-43 39-44Z" fill="#fff"/>
    <path d="M250 6 294 51l-8 27-27 8c-24 0-43-18-43-41 0-21 15-38 34-39Z" fill="url(#badge)"/>
    <path d="M250 6v42h44" fill="#e0f2fe" opacity=".95"/>
    <path d="m250 6 44 45-32-4c-7-1-12-6-12-13Z" fill="#fff"/>
  </g>
  <g transform="translate(231 29)">
    <rect x="10" y="0" width="16" height="29" rx="8" fill="#1f2937"/>
    <rect x="13" y="3" width="10" height="22" rx="5" fill="url(#accent)"/>
    <path d="M5 17c0 9 5.8 15 13 15s13-6 13-15M18 32v7M11 39h14" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 6v21M44 11v11M50 3v27" stroke="#f97316" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
